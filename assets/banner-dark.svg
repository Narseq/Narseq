<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#A78BFA" fill-opacity=".22"/>
    </pattern>
    <linearGradient id="fade-l" x1="0" x2="1"><stop offset=".35" stop-color="#000"/><stop offset=".75" stop-color="#fff"/></linearGradient>
    <mask id="grid-mask"><rect width="800" height="220" fill="url(#fade-l)"/></mask>
    <linearGradient id="horizon" x1="0" x2="1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#A78BFA" stop-opacity=".25"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="type"><rect x="50" y="60" width="0" height="70" class="tp"/></clipPath>
    <symbol id="cross" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M10 1v5M10 14v5M1 10h5M14 10h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
  </defs>
  <style>
    .n { font: 700 56px Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #E6EDF3; }
    .tag { font: 400 14px Consolas, 'SF Mono', Menlo, monospace; fill: #8B949E; }
    .s { font: 400 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8B949E; letter-spacing: .3px; }
    .hl { fill: #C4B5FD; font-weight: 600; }
    .kf { font: 600 14px 'Segoe UI', Ubuntu, Arial, sans-serif; fill: #E6EDF3; }
    .me { fill: #C4B5FD; font-weight: 700; }
    .mono { font: 400 13px Consolas, 'SF Mono', Menlo, monospace; fill: #E6EDF3; }
    .ok { fill: #3FB950; }

    .tp { animation: tp .9s steps(6) .5s forwards; }
    @keyframes tp { to { width: 200px; } }
    .caret { opacity: 0; animation: blink 1s steps(1) 1.4s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    .fade { opacity: 0; animation: fade .6s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }
    .d0 { animation-delay: .1s; } .d1 { animation-delay: 1.5s; } .d2 { animation-delay: 3s; }

    .kill { opacity: 0; transform-box: fill-box; animation: kill .45s cubic-bezier(.2,1.2,.4,1) forwards; }
    @keyframes kill { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
    .k1 { animation-delay: 1.8s; } .k2 { animation-delay: 2.3s; } .k3 { animation-delay: 2.8s; }

    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    .bar { animation: bar 2s ease-in-out infinite; }
    .b2 { animation-delay: .2s; } .b3 { animation-delay: .4s; } .b4 { animation-delay: .6s; }
    @keyframes bar { 50% { opacity: .35; } }

    @media (prefers-reduced-motion: reduce) {
      .tp, .caret, .fade, .kill, .pulse, .bar { animation: none !important; opacity: 1 !important; transform: none !important; }
      .tp { width: 200px; }
    }
  </style>

  <rect width="800" height="220" fill="url(#dots)" mask="url(#grid-mask)"/>
  <rect x="0" y="216" width="800" height="1.5" fill="url(#horizon)"/>

  <!-- name, typed like a console -->
  <text x="57" y="50" class="tag fade d0">&gt; connect narseq</text>
  <text x="54" y="114" class="n" clip-path="url(#type)">Narseq</text>
  <rect x="262" y="72" width="4" height="46" fill="#A78BFA" class="caret"/>
  <text x="57" y="156" class="s fade d1">plugin &amp; bot developer</text>
  <text x="57" y="182" class="s fade d1">technician @ <tspan class="hl">Fragujemy</tspan></text>

  <!-- kill feed -->
  <g class="kill k1">
    <rect x="500" y="24" width="260" height="30" rx="4" fill="#0D1117" fill-opacity=".7" stroke="#E0434E" stroke-width="1.5"/>
    <text x="514" y="44" class="kf"><tspan class="me">Narseq</tspan></text>
    <use href="#cross" x="578" y="29" width="20" height="20" color="#E6EDF3"/>
    <text x="608" y="44" class="kf">bugs</text>
  </g>
  <g class="kill k2">
    <rect x="500" y="62" width="260" height="30" rx="4" fill="#0D1117" fill-opacity=".7" stroke="#E0434E" stroke-width="1.5"/>
    <text x="514" y="82" class="kf"><tspan class="me">Narseq</tspan></text>
    <use href="#cross" x="578" y="67" width="20" height="20" color="#E6EDF3"/>
    <text x="608" y="82" class="kf">lag spikes</text>
  </g>
  <g class="kill k3">
    <rect x="500" y="100" width="260" height="30" rx="4" fill="#0D1117" fill-opacity=".7" stroke="#E0434E" stroke-width="1.5"/>
    <text x="514" y="120" class="kf"><tspan class="me">Narseq</tspan></text>
    <use href="#cross" x="578" y="105" width="20" height="20" color="#E6EDF3"/>
    <text x="608" y="120" class="kf">server downtime</text>
  </g>

  <!-- server status -->
  <g class="fade d2">
    <rect x="500" y="152" width="260" height="34" rx="8" fill="#161B22" stroke="#30363D"/>
    <circle cx="518" cy="169" r="4" class="ok pulse"/>
    <text x="530" y="173" class="mono">fragujemy.com</text>
    <text x="652" y="173" class="mono ok">online</text>
    <rect x="718" y="172" width="4" height="5" rx="1" class="ok bar"/>
    <rect x="725" y="168" width="4" height="9" rx="1" class="ok bar b2"/>
    <rect x="732" y="164" width="4" height="13" rx="1" class="ok bar b3"/>
    <rect x="739" y="160" width="4" height="17" rx="1" class="ok bar b4"/>
  </g>
</svg>
